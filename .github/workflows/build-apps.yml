name: Compilar aplicaciones

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'estilos.css'
      - 'app.js'
      - 'escudo.png'
      - 'package.json'
      - 'electron-main.cjs'
      - 'capacitor.config.json'
      - '.github/workflows/build-apps.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Comedor-French-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - name: Preparar archivos web
        run: |
          mkdir -p dist
          cp index.html estilos.css app.js escudo.png dist/
      - run: npx cap add android
      - run: npx cap sync android
      - name: Compilar APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Comedor-French-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  ios-project:
    name: Proyecto iOS (requiere firma Apple para instalar)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Preparar archivos web
        run: |
          mkdir -p dist
          cp index.html estilos.css app.js escudo.png dist/
      - run: npx cap add ios
      - run: npx cap sync ios
      - uses: actions/upload-artifact@v4
        with:
          name: Comedor-French-iOS-Xcode-Project
          path: ios/
          if-no-files-found: error
          retention-days: 30
